global:
  imageRegistry: ""
  imagePullSecrets: []
  appVersion: latest

nameOverride: ""
fullnameOverride: ""

clusterName: sharxconnect
domainFilter: sharxconnect.app

externalDns:
  namespace: external-dns
  deployment: external-dns

auth:
  required: true
  frontendUrl: ""
  existingSecret: externaldns-web-ui-auth
  jwtSecret: ""
  oidc:
    enabled: true
    issuerUrl: ""
    clientId: externaldns-web-ui
    clientSecret: ""
    scopes: "openid profile email"
    roleClaim: groups
    groupClaim: groups
    authentikPublicUrl: ""
  adminRoles: "admin,super_admin,authentik Admins"

backend:
  replicas: 1
  image:
    repository: externaldns-web-ui/backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

frontend:
  replicas: 1
  image:
    repository: externaldns-web-ui/frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    containerPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  host: externaldns.sharxconnect.app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
