apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "externaldns-web-ui.backendFullname" . }}
  labels:
    {{- include "externaldns-web-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "externaldns-web-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "externaldns-web-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "externaldns-web-ui.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "externaldns-web-ui.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: EXTERNALDNS_NAMESPACE
              value: {{ .Values.externalDns.namespace | quote }}
            - name: EXTERNALDNS_DEPLOYMENT
              value: {{ .Values.externalDns.deployment | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: DOMAIN_FILTER
              value: {{ .Values.domainFilter | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "externaldns-web-ui.backendFullname" . }}
  labels:
    {{- include "externaldns-web-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "externaldns-web-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
