apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "externaldns-web-ui.backendFullname" . }}
  labels:
    {{- include "externaldns-web-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "externaldns-web-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "externaldns-web-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "externaldns-web-ui.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "externaldns-web-ui.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: AUTH_REQUIRED
              value: {{ .Values.auth.required | quote }}
            - name: FRONTEND_URL
              value: {{ include "externaldns-web-ui.frontendUrl" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "externaldns-web-ui.fullname" .)) }}
                  key: JWT_SECRET
            - name: OIDC_ENABLED
              value: {{ .Values.auth.oidc.enabled | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.auth.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "externaldns-web-ui.fullname" .)) }}
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URL
              value: {{ printf "%s/api/auth/callback" (include "externaldns-web-ui.frontendUrl" .) | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            - name: OIDC_ROLE_CLAIM
              value: {{ .Values.auth.oidc.roleClaim | quote }}
            - name: OIDC_GROUP_CLAIM
              value: {{ .Values.auth.oidc.groupClaim | quote }}
            - name: AUTHENTIK_PUBLIC_URL
              value: {{ .Values.auth.oidc.authentikPublicUrl | quote }}
            - name: ADMIN_ROLES
              value: {{ .Values.auth.adminRoles | quote }}
            - name: EXTERNALDNS_NAMESPACE
              value: {{ .Values.externalDns.namespace | quote }}
            - name: EXTERNALDNS_DEPLOYMENT
              value: {{ .Values.externalDns.deployment | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: DOMAIN_FILTER
              value: {{ .Values.domainFilter | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "externaldns-web-ui.backendFullname" . }}
  labels:
    {{- include "externaldns-web-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "externaldns-web-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
