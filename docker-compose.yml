services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - LISTEN_ADDR=:8080
      - AUTH_REQUIRED=false
      - JWT_SECRET=dev-secret-change-me
      - FRONTEND_URL=http://localhost:5173
      - KUBECONFIG=/tmp/kubeconfig
      - EXTERNALDNS_NAMESPACE=external-dns
      - EXTERNALDNS_DEPLOYMENT=external-dns
      - CLUSTER_NAME=local
      - DOMAIN_FILTER=example.com
    volumes:
      - ${KUBECONFIG:-~/.kube/config}:/tmp/kubeconfig:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8088:8080"
    depends_on:
      - backend
